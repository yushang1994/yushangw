# Photo albums for the "Beyond Work" page (_pages/beyond-work.md).
#
# Each album:
#   id           short slug used in the page URL hash, e.g. #cats
#   title        album name shown on the card and tab
#   description  one or two sentences shown above the photo grid
#   cover        which photo (by file name) to use on the album card
#   aspect       "square" (default) or "wide" (16:9) tiles
#   photos       list of {file, alt, caption}; `file` is the original under /images/,
#                and a matching thumbnail is expected at /images/thumbs/<name>.jpg
#
# To add a photo: put the full-size image in images/baking/ or images/aboutme/,
# add a 640px thumbnail with the same base name to images/thumbs/, and list it here.

- id: cats
  title: Cats
  description: >-
    I share my home with two cats at very different stages of life. Sam, an 18-year-old Nebelung,
    is a calm and gentle presence, while Rashba, a 1-year-old British Shorthair, brings curiosity
    and youthful energy into every day.
  cover: aboutme/DSCF2054.JPG
  photos:
    - file: aboutme/DSCF2054.JPG
      alt: Rashba, a British Shorthair cat, looking at the camera
      caption: Rashba
    - file: aboutme/DSCF2046.JPG
      alt: Sam, a Nebelung cat, resting his head on a toy
      caption: Sam
    - file: baking/DSCF0526.JPG
      alt: Sam napping in a basket in the afternoon sun
      caption: Sam, afternoon nap
    - file: baking/DSCF0604.JPG
      alt: Sam sitting in a basket by the window
      caption: Sam at the window
    - file: baking/macaron2.jpg
      alt: Sam sniffing a tray of freshly baked macarons
      caption: Quality control

- id: pastry
