      alt: Strawberry cream cake with piped frosting
      caption: Strawberry cream cake
    - file: baking/Chocolatetart.JPG
      alt: Chocolate tart with piped chocolate cream
      caption: Chocolate cream tart
    - file: baking/DSCF0597.JPG
      alt: Lemon meringue tart with torched meringue
      caption: Lemon meringue tart
    - file: baking/Chestnuttart.JPG
      alt: Chestnut tart with piped cream and fruit
      caption: Chestnut tart
    - file: baking/canele.JPG
      alt: Two canelés on a plate beside coffee cups
      caption: Canelés
    - file: baking/macaron3.jpg
      alt: Green macarons decorated as little monsters
      caption: Monster macarons
    - file: baking/macaron.JPG
      alt: A matcha macaron held in hand
      caption: Matcha macaron
    - file: baking/macaron1.JPG
      alt: Macaron shells cooling on a baking tray
      caption: Macaron shells
    - file: baking/DSCF0581.JPG
      alt: A slice of strawberry cake on a plate
      caption: Strawberry cake, sliced
    - file: baking/blacktea.jpg
      alt: A slice of black tea cake, with Sam watching from a basket
