# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
locale                   : "en-US"
title                    : "Yushang Wei"
title_separator          : "-"
name                     : &name "Yushang Wei"
description              : &description "Yushang Wei is a Lecturer in the Department of Economics at Auburn University. Applied microeconomics: health, transportation, and environmental economics."
# `url` is the host only; `baseurl` is the repository subpath on GitHub Pages.
# If the site ever moves to https://yushang1994.github.io/ or a custom domain,
# set baseurl to "" and nothing else needs to change.
url                      : https://yushang1994.github.io
baseurl                  : "/yushangw"
repository               : "yushang1994/yushangw"
teaser                   : # filename of teaser fallback teaser image placed in /images/, .e.g. "500x300.png"
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : false


# SEO Related
google_site_verification :
bing_site_verification   :
yandex_site_verification :

# Social Sharing
twitter:
  username               : helenweiyushang
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : profile-2026.jpg # Open Graph/Twitter default site image
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : Person
  name                   : *name
  links:
    - https://twitter.com/helenweiyushang
    - https://www.linkedin.com/in/yushang-wei-1b034a170
    - https://github.com/yushang1994


# Analytics
analytics:
  provider               :  # false (default), "google", "google-universal", "custom", "goatcounter"
  google:
    tracking_id          :
  goatcounter:
    code                 :

# Site Author
author:
  name             : "Yushang Wei"
  avatar           : "profile-2026.jpg"
  bio              : "Lecturer, Department of Economics, Auburn University"
  location         : Auburn, AL
  employer         :
  pubmed           :
  orcid            :
  googlescholar    :
  email            : "yzw0178@auburn.edu"
  researchgate     :  # example: "https://www.researchgate.net/profile/yourprofile"
  uri              :
  github           : "yushang1994"
  linkedin         : "yushang-wei-1b034a170"
  twitter          : helenweiyushang


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .Rproj.user
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - LICENSE
  - README
  - README.md
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: America/Chicago # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins (all supported by GitHub Pages)
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-github-metadata


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
